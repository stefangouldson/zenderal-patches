; Zenderal - NPC Potions
; ----------------------------------------------------------------------------
; Distributes Enderal's restore-health, restore-mana and restore-stamina potions
; plus Ambrosia to humanoid NPCs, level-banded to Enderal's own tier ladder
; (1 / 10 / 18 / 28 / 38 - the same bands as _00ETraderPotion10/20/30).
;
; Supersedes "Zenderal - Enemy Potions.esp", which banded the same three potion
; lines into death-item leveled lists. Disable that mod: SPID puts these in the
; NPC's live inventory instead, so enemies can actually drink them.
;
; Filters on every line:
;   Strings  ActorTypeNPC  - keyword 013794:Skyrim.esm, carried by every
;                            humanoid race in Enderal. Excludes animals,
;                            creatures and the Lost Ones' creature races.
;   Traits   -S/-C/-D      - no summons, no children, no StartsDead props.
;
; FormIDs are 0x<hex>~Skyrim.esm. In Enderal, Skyrim.esm IS base Enderal, and
; every ID below was resolved against reference/base/Skyrim/Ingestibles/.
; Written pre-sanitised (~ not " - ", no spaces around | or ,, no leading
; zeros) so SPID never rewrites this file in place.
; ----------------------------------------------------------------------------

; --- Restore Health: _NNE_Genesungstrank (5 tiers) ---
Item = 0x28C8~Skyrim.esm|ActorTypeNPC|NONE|1/9|-S/-C/-D|1-2|55
Item = 0x28C5~Skyrim.esm|ActorTypeNPC|NONE|10/17|-S/-C/-D|1-2|55
Item = 0x28C6~Skyrim.esm|ActorTypeNPC|NONE|18/27|-S/-C/-D|1-2|55
Item = 0x28C7~Skyrim.esm|ActorTypeNPC|NONE|28/37|-S/-C/-D|1-2|55
Item = 0x28C9~Skyrim.esm|ActorTypeNPC|NONE|38|-S/-C/-D|1-2|55

; --- Restore Mana: _NNE_Manatrank (5 tiers) ---
Item = 0x28DB~Skyrim.esm|ActorTypeNPC|NONE|1/9|-S/-C/-D|1-2|45
Item = 0x19E3B~Skyrim.esm|ActorTypeNPC|NONE|10/17|-S/-C/-D|1-2|45
Item = 0x90892~Skyrim.esm|ActorTypeNPC|NONE|18/27|-S/-C/-D|1-2|45
Item = 0x9B6CB~Skyrim.esm|ActorTypeNPC|NONE|28/37|-S/-C/-D|1-2|45
Item = 0x1037F7~Skyrim.esm|ActorTypeNPC|NONE|38|-S/-C/-D|1-2|45

; --- Restore Stamina: _NNE_Morgenlufttrank (5 tiers) ---
; NOTE: Morgenlufttrank ("Morning Air Potion") is the RESTORE-stamina line.
; _NNE_Ausdauertrank is FORTIFY stamina and has only 2 tiers in base Enderal.
Item = 0x28DE~Skyrim.esm|ActorTypeNPC|NONE|1/9|-S/-C/-D|1-2|45
Item = 0x85668~Skyrim.esm|ActorTypeNPC|NONE|10/17|-S/-C/-D|1-2|45
Item = 0x9B6CA~Skyrim.esm|ActorTypeNPC|NONE|18/27|-S/-C/-D|1-2|45
Item = 0x1037F5~Skyrim.esm|ActorTypeNPC|NONE|28/37|-S/-C/-D|1-2|45
Item = 0x1037F6~Skyrim.esm|ActorTypeNPC|NONE|38|-S/-C/-D|1-2|45

; --- Ambrosia: _00E_Ambrosia, -20% Arcane Fever. Rare, no level band. ---
Item = 0xFEC69~Skyrim.esm|ActorTypeNPC|NONE|NONE|-S/-C/-D|1|12
